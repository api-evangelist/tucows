apis:
- name: OpenSRS Domains and TLS/SSL API
  description: >-
    Wholesale reseller API for domain-name lookup, registration, transfer, renewal, DNS-zone management
    and TLS/SSL certificate ordering. An XML-over-HTTPS POST protocol authenticated with a reseller
    username and a double-MD5 request signature.
  humanURL: https://domains.opensrs.guide
  baseURL: https://rr-n1-tor.opensrs.net:55443
