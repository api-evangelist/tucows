aid: tucows
name: Tucows
description: >-
  Tucows is one of the world's largest internet-services and domain companies. Its OpenSRS division runs
  a wholesale reseller platform for domain-name registration, DNS, TLS/SSL certificates and hosted email,
  exposed through the OpenSRS API (an XML-over-HTTPS reseller protocol) and the OpenSRS Mail API (OMA).
  Tucows also operates Wavelo, a telecom BSS/OSS billing, provisioning and subscriber-management platform
  for communication service providers, and the Ting Internet fiber business. This profile captures the
  public OpenSRS developer surface — the domains/SSL API, the email provisioning API, authentication,
  error codes, sandbox, events and lifecycle. Tucows is a Union Square Ventures portfolio company.
