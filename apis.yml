- name: OpenSRS Email API (OMA)
  description: >-
    The OpenSRS Mail API is the provisioning interface for the OpenSRS hosted email system — create,
    modify and delete mailboxes, aliases, domains and other aspects of the service. A stateless web
    service where each interaction is a single HTTP request/response.
  humanURL: https://email.opensrs.guide
  baseURL: https://admin.hostedemail.com/api
